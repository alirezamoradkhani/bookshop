services:
  mongo:
    # Keep infrastructure logs available via docker compose logs, outside the app console.
    attach: false
    image: mongo:8
    container_name: bookshop-mongo
    restart: always
    command: ["mongod", "--config", "/etc/mongod.conf"]
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo.conf:/etc/mongod.conf:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s
      start_interval: 5s

  redis:
    # Keep infrastructure logs available via docker compose logs, outside the app console.
    attach: false
    image: redis:7
    container_name: bookshop-redis
    restart: always
    command: ["redis-server", "--loglevel", "warning"]
    ports:
      - "6380:6379"

  rabbitmq:
    # Keep infrastructure logs available via docker compose logs, outside the app console.
    attach: false
    image: rabbitmq:3-management
    container_name: bookshop-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro

  meilisearch:
    # Keep infrastructure logs available via docker compose logs, outside the app console.
    attach: false
    image: getmeili/meilisearch
    container_name: bookshop-meilisearch
    restart: always
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: masterKey
      MEILI_LOG_LEVEL: ERROR
    volumes:
      - meili_data:/meili_data

  app:
    build: .
    container_name: bookshop-app
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      meilisearch:
        condition: service_started
    env_file:
      - .env
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DATABASE: bookshop
      PYTHONUNBUFFERED: "1"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level error --no-access-log

  consumer-worker:
    build: .
    container_name: bookshop-consumer-worker
    restart: always
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DATABASE: bookshop
      PYTHONUNBUFFERED: "1"
    volumes:
      - .:/app
    command: python -m app.workers.start_consumers

  outbox-worker:
    build: .
    container_name: bookshop-outbox-worker
    restart: always
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DATABASE: bookshop
      PYTHONUNBUFFERED: "1"
    volumes:
      - .:/app
    command: python -m app.workers.outbox_worker

  scheduler-worker:
    build: .
    container_name: bookshop-scheduler-worker
    restart: always
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DATABASE: bookshop
      PYTHONUNBUFFERED: "1"
    volumes:
      - .:/app
    command: python -m app.workers.scheduler_worker

  meili-init:
    build: .
    depends_on:
      meilisearch:
        condition: service_started
    command: >
      sh -c "sleep 15 && python -m app.search.index_setup"

volumes:
  mongo_data:
  meili_data:
